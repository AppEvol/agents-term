name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_MAJOR_MINOR: "0.3"

jobs:
  build-and-unit-test:
    name: Build APK & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure debug.keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run unit tests and build debug & test APKs
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          SHORT_SHA="${GITHUB_SHA_FULL::7}"
          export APP_VERSION_NAME="${APP_MAJOR_MINOR}.${APP_VERSION_CODE}-${SHORT_SHA}"
          echo "Building AgentsTerm ${APP_VERSION_NAME} (versionCode=${APP_VERSION_CODE})"
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  daemon-and-cli-tests:
    name: VM Daemon & CLI Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run VM daemon tests (unit, process end-to-end, install.sh)
        run: python3 -W error::ResourceWarning -m unittest discover -s daemon/tests -v

      - name: Run app_state_cli tests
        run: python3 -W error::ResourceWarning -m unittest discover -s app_state_cli -v

  e2e-tests:
    name: End-to-End Android Instrumented Tests
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure debug.keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set build version environment
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${APP_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Run E2E instrumented tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9a
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  publish-apk:
    name: Publish Verified APK Release
    runs-on: ubuntu-latest
    needs: [build-and-unit-test, e2e-tests, daemon-and-cli-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist

      - name: Publish versioned APK release and update rolling latest alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${APP_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TAG="v${VERSION}"
          STABLE_APK="dist/AgentsTerm-debug.apk"
          VERSIONED_APK="dist/AgentsTerm-${TAG}-debug.apk"
          cp dist/app-debug.apk "$STABLE_APK"
          cp dist/app-debug.apk "$VERSIONED_APK"

          EXISTING_TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq '.[].tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' || true)

          IS_NEWEST="true"
          EXISTING_MAX=$(printf '%s\n' "$EXISTING_TAGS" \
            | sed -n 's/^v[0-9][0-9]*\.[0-9][0-9]*\.\([0-9][0-9]*\)-.*$/\1/p' \
            | sort -nr | head -n 1 || true)
          if [ -n "${EXISTING_MAX:-}" ] && [ "$EXISTING_MAX" -gt "$GITHUB_RUN_NUMBER" ]; then
            IS_NEWEST="false"
          fi

          LATEST_FLAG="--latest"
          if [ "$IS_NEWEST" != "true" ]; then
            LATEST_FLAG="--latest=false"
          fi

          PREV_TAG=$(printf '%s\n' "$EXISTING_TAGS" \
            | awk -F'[.-]' -v cur="$GITHUB_RUN_NUMBER" 'NF >= 3 && $3 < cur { print $3, $0 }' \
            | sort -nr | head -n 1 | awk '{print $2}' || true)

          NOTES=$(printf 'Verified Android debug APK automatically built and tested on green `main` commit `%s`.\n\n- **Version:** `%s` (`versionCode=%s`)\n- **Build & unit tests:** passed\n- **Android Emulator E2E tests:** passed\n- **CI run:** https://github.com/%s/actions/runs/%s\n\n### Install on Android\n1. Download `AgentsTerm-debug.apk` directly on your Android phone (always-latest link: https://github.com/%s/releases/latest/download/AgentsTerm-debug.apk).\n2. Open the downloaded APK and allow installing from your browser/files app if prompted.\n' \
            "$SHORT_SHA" "$VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY")

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STABLE_APK" "$VERSIONED_APK" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" \
              --title "AgentsTerm ${TAG}" \
              --notes "$NOTES" \
              "$LATEST_FLAG" \
              --repo "${GITHUB_REPOSITORY}"
          else
            NOTES_ARGS=(--generate-notes --notes "$NOTES")
            if [ -n "${PREV_TAG:-}" ]; then
              NOTES_ARGS+=(--notes-start-tag "$PREV_TAG")
            fi
            gh release create "$TAG" "$STABLE_APK" "$VERSIONED_APK" \
              --target "$GITHUB_SHA" \
              --title "AgentsTerm ${TAG}" \
              "${NOTES_ARGS[@]}" \
              "$LATEST_FLAG" \
              --repo "${GITHUB_REPOSITORY}"
          fi

          # Keep the rolling `latest` tag & release asset in sync for /releases/download/latest/AgentsTerm-debug.apk links
          if [ "$IS_NEWEST" = "true" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -X PATCH \
                -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            fi
            if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              ROLLING_NOTES=$(printf 'Rolling alias pointing to verified release [`%s`](https://github.com/%s/releases/tag/%s).\n\n%s\n' \
                "$TAG" "$GITHUB_REPOSITORY" "$TAG" "$NOTES")
              gh release upload latest "$STABLE_APK" --clobber --repo "${GITHUB_REPOSITORY}"
              gh release edit latest \
                --title "AgentsTerm Rolling Latest (${TAG})" \
                --notes "$ROLLING_NOTES" \
                --latest=false \
                --repo "${GITHUB_REPOSITORY}"
            fi
          fi
