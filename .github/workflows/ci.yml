name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The merge queue tests each queued pull request on top of main and the
  # pull requests ahead of it, then merges it if the required checks pass.
  merge_group:
  workflow_dispatch:
    inputs:
      force_daemon_tests:
        description: 'Run Rust daemon build and multi-distro Linux VM E2E matrix even if binaries are unchanged'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_MAJOR_MINOR: "0.3"

jobs:
  static-checks:
    name: Static Checks (lint, formatting, import order, dead code)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pinned static-check tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentsterm-static-checks
          key: static-checks-${{ runner.os }}-${{ hashFiles('scripts/static-checks.sh') }}

      - name: Run static checks (ruff, vulture, ktlint, detekt, shellcheck, actionlint)
        run: scripts/static-checks.sh

  script-tests:
    name: CI & Utility Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run CI and utility script unit tests
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py unittest
          --start-dir scripts/tests
          --output allure-results/scripts
          --parent-suite "CI & Utility Script Tests"
          --tag scripts

      - name: Upload Allure results (script tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-scripts
          path: allure-results/scripts/
          if-no-files-found: ignore

  daemon-change-check:
    name: Daemon Change Check (reuse verified binaries when unchanged)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      binary_changed: ${{ steps.detect.outputs.binary_changed }}
      run_rust_daemon_build: ${{ steps.detect.outputs.run_rust_daemon_build }}
      run_daemon_vm_e2e: ${{ steps.detect.outputs.run_daemon_vm_e2e }}
      run_installer_tests: ${{ steps.detect.outputs.run_installer_tests }}
      run_android_build: ${{ steps.detect.outputs.run_android_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check whether daemon binaries or daemon tests changed
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_DAEMON_TESTS: ${{ inputs.force_daemon_tests }}
        run: scripts/ci/daemon_change_check.sh

      - name: Upload verified cached daemon binaries (when unchanged)
        if: steps.detect.outputs.binary_changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: daemon-binaries
          path: dist-daemon/
          if-no-files-found: error

  rust-daemon-build-and-test:
    name: Rust VM Daemon (format, clippy, tests, static musl binaries)
    runs-on: ubuntu-latest
    needs: [daemon-change-check]
    if: needs.daemon-change-check.outputs.run_rust_daemon_build == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain and musl targets
        run: scripts/ci/setup_rust_toolchain.sh

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('daemon-rs/Cargo.toml', 'daemon-rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting and Clippy
        working-directory: daemon-rs
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust daemon unit and integration tests
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py cargo
          --cwd daemon-rs
          --output allure-results/rust-daemon
          --parent-suite "Rust VM Daemon"
          --tag rust-daemon
          -- cargo test -- --show-output

      - name: Upload Allure results (Rust daemon)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-rust-daemon
          path: allure-results/rust-daemon/
          if-no-files-found: ignore

      - name: Build static musl release binaries (x86_64 and aarch64)
        if: needs.daemon-change-check.outputs.binary_changed == 'true'
        run: scripts/ci/build_rust_daemon.sh

      - name: Upload static Rust daemon binaries
        if: needs.daemon-change-check.outputs.binary_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daemon-binaries
          path: dist-daemon/
          if-no-files-found: error

  build-and-unit-test:
    name: Build APK & Unit Tests
    runs-on: ubuntu-latest
    needs: [daemon-change-check]
    if: needs.daemon-change-check.outputs.run_android_build == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure debug.keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: scripts/ensure-debug-keystore.sh

      - name: Install Android SDK components
        run: scripts/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run Android Lint, unit tests and build debug & test APKs
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          GITHUB_SHA_FULL: ${{ github.sha }}
          PUBLISH_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          PUBLISH_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/ci/build_and_unit_test.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload golden image differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-differences
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Convert Android unit test results for Allure
        if: always()
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py junit
          --input app/build/test-results/testDebugUnitTest
          --output allure-results/android-unit
          --parent-suite "Android Unit Tests"
          --framework junit4
          --language kotlin
          --roborazzi-dir app/build/outputs/roborazzi
          --tag android-unit

      - name: Upload Allure results (Android unit tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android-unit
          path: allure-results/android-unit/
          if-no-files-found: ignore

  installer-tests:
    name: Daemon Installer Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [daemon-change-check]
    if: needs.daemon-change-check.outputs.run_installer_tests == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test the POSIX installer for the Rust daemon
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py unittest
          --start-dir daemon-rs/tests
          --output allure-results/installer
          --parent-suite "Daemon Installer Tests"
          --suite "Python ${PYTHON_VERSION}"
          --variant "py${PYTHON_VERSION}"
          --param "python=${PYTHON_VERSION}"
          --tag installer

      - name: Upload Allure results (installer tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-installer-py-${{ matrix.python }}
          path: allure-results/installer/
          if-no-files-found: ignore

  docker-vm-e2e:
    name: Rust Daemon Linux VM E2E (${{ matrix.vm.label }})
    runs-on: ubuntu-latest
    needs: [daemon-change-check, rust-daemon-build-and-test]
    if: >-
      always() &&
      !cancelled() &&
      needs.daemon-change-check.result == 'success' &&
      needs.daemon-change-check.outputs.run_daemon_vm_e2e == 'true' &&
      (needs.rust-daemon-build-and-test.result == 'success' || needs.rust-daemon-build-and-test.result == 'skipped')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vm:
          - target: vm-ubuntu-2404
            label: Ubuntu 24.04 LTS (zero-dep, curl, cron)
          - target: vm-ubuntu-2204
            label: Ubuntu 22.04 LTS (zero-dep, curl, cron)
          - target: vm-debian-12
            label: Debian 12 Bookworm (zero-dep, wget-only)
          - target: vm-almalinux-9
            label: AlmaLinux 9 / RHEL 9 (curl, cronie)
          - target: vm-fedora-41
            label: Fedora 41 (zero-dep, no cron)
          - target: vm-amazonlinux-2023
            label: Amazon Linux 2023 / EC2 (no cron)
          - target: vm-alpine-321
            label: Alpine 3.21 (musl, BusyBox ash, wget-only)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static Rust daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binaries
          path: dist-daemon

      - name: Place static Rust binary where start_vm.sh expects it
        run: scripts/ci/stage_daemon_binary.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run headless Rust daemon E2E suite on ${{ matrix.vm.target }}
        env:
          E2E_VM_TARGET: ${{ matrix.vm.target }}
          VM_LABEL: ${{ matrix.vm.label }}
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py unittest
          --start-dir e2e/docker-vm
          --output allure-results/docker-vm
          --parent-suite "Linux VM E2E"
          --suite "${VM_LABEL}"
          --variant "${E2E_VM_TARGET}"
          --param "vm_target=${E2E_VM_TARGET}"
          --tag docker-vm-e2e

      - name: Upload Allure results (Linux VM E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-docker-vm-${{ matrix.vm.target }}
          path: allure-results/docker-vm/
          if-no-files-found: ignore

  e2e-tests:
    name: End-to-End Android Instrumented Tests
    runs-on: ubuntu-latest
    needs: [daemon-change-check, build-and-unit-test, rust-daemon-build-and-test]
    if: >-
      always() &&
      !cancelled() &&
      needs.daemon-change-check.result == 'success' &&
      needs.build-and-unit-test.result == 'success' &&
      (needs.rust-daemon-build-and-test.result == 'success' || needs.rust-daemon-build-and-test.result == 'skipped')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download static Rust daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binaries
          path: dist-daemon

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure debug.keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: scripts/ensure-debug-keystore.sh

      - name: Install Android SDK components
        run: scripts/install-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Enable KVM group permissions
        run: scripts/ci/enable_kvm.sh

      - name: Set build version environment
        run: scripts/ci/set_build_version_env.sh

      - name: Start zero-dependency Docker E2E VM container
        id: docker_vm
        run: scripts/ci/start_docker_vm.sh

      - name: Run E2E instrumented tests on Android Emulator (mock + real zero-dep Docker VM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9a
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/ci/run_android_e2e.sh

      - name: Stop Docker E2E VM container
        if: always()
        env:
          SNAPSHOT_DIR: ${{ steps.docker_vm.outputs.SNAPSHOT_DIR }}
        run: scripts/ci/stop_docker_vm.sh

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      - name: Convert Android E2E test results for Allure
        if: always()
        run: >-
          python3 -W error::ResourceWarning scripts/allure_results.py junit
          --input app/build/outputs/androidTest-results/connected
          --output allure-results/android-e2e
          --parent-suite "Android Instrumented E2E"
          --framework android-junit
          --language kotlin
          --tag android-e2e

      - name: Upload Allure results (Android E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android-e2e
          path: allure-results/android-e2e/
          if-no-files-found: ignore

  allure-report:
    name: Allure 3 Test Report
    runs-on: ubuntu-latest
    needs:
      - script-tests
      - daemon-change-check
      - rust-daemon-build-and-test
      - build-and-unit-test
      - installer-tests
      - docker-vm-e2e
      - e2e-tests
    if: always() && !cancelled()
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache pinned Allure 3 CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentsterm-allure
          key: allure3-${{ runner.os }}-node22-${{ hashFiles('scripts/allure-report.sh') }}

      - name: Download all Allure result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-raw
          merge-multiple: false

      - name: Merge results, write step summary, and generate Allure 3 report
        id: report
        run: scripts/ci/generate_allure_report.sh

      - name: Upload Allure 3 HTML report
        if: steps.report.outputs.has_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

  ci-gate:
    name: All Required CI Checks
    runs-on: ubuntu-latest
    needs:
      - static-checks
      - script-tests
      - daemon-change-check
      - rust-daemon-build-and-test
      - build-and-unit-test
      - installer-tests
      - docker-vm-e2e
      - e2e-tests
      - allure-report
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify all CI checks passed
        env:
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          SCRIPT_TESTS: ${{ needs.script-tests.result }}
          DAEMON_CHANGE_CHECK: ${{ needs.daemon-change-check.result }}
          RUST_DAEMON: ${{ needs.rust-daemon-build-and-test.result }}
          BUILD_AND_UNIT_TEST: ${{ needs.build-and-unit-test.result }}
          INSTALLER_TESTS: ${{ needs.installer-tests.result }}
          DOCKER_VM_E2E: ${{ needs.docker-vm-e2e.result }}
          E2E_TESTS: ${{ needs.e2e-tests.result }}
          ALLURE_REPORT: ${{ needs.allure-report.result }}
          RUN_ANDROID_BUILD: ${{ needs.daemon-change-check.outputs.run_android_build }}
        run: scripts/ci/ci_gate.sh

  publish-branch-prerelease:
    name: Publish Branch Pre-Release (APK + Rust Daemon Binaries)
    runs-on: ubuntu-latest
    needs: [static-checks, script-tests, daemon-change-check, rust-daemon-build-and-test, build-and-unit-test, e2e-tests, installer-tests, docker-vm-e2e, allure-report]
    if: >-
      always() &&
      !cancelled() &&
      needs.static-checks.result == 'success' &&
      needs.script-tests.result == 'success' &&
      needs.daemon-change-check.result == 'success' &&
      needs.build-and-unit-test.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.allure-report.result == 'success' &&
      (needs.rust-daemon-build-and-test.result == 'success' || needs.rust-daemon-build-and-test.result == 'skipped') &&
      (needs.installer-tests.result == 'success' || needs.installer-tests.result == 'skipped') &&
      (needs.docker-vm-e2e.result == 'success' || needs.docker-vm-e2e.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist

      - name: Download static Rust daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: daemon-binaries
          path: dist

      - name: Publish pre-release without touching latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: scripts/ci/publish_branch_prerelease.sh

  publish-apk:
    name: Publish Verified APK & Static Daemon Release
    runs-on: ubuntu-latest
    needs: [static-checks, script-tests, daemon-change-check, rust-daemon-build-and-test, build-and-unit-test, e2e-tests, installer-tests, docker-vm-e2e, allure-report]
    if: >-
      always() &&
      !cancelled() &&
      needs.static-checks.result == 'success' &&
      needs.script-tests.result == 'success' &&
      needs.daemon-change-check.result == 'success' &&
      needs.build-and-unit-test.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.allure-report.result == 'success' &&
      (needs.rust-daemon-build-and-test.result == 'success' || needs.rust-daemon-build-and-test.result == 'skipped') &&
      (needs.installer-tests.result == 'success' || needs.installer-tests.result == 'skipped') &&
      (needs.docker-vm-e2e.result == 'success' || needs.docker-vm-e2e.result == 'skipped') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: dist

      - name: Download static Rust daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: daemon-binaries
          path: dist

      - name: Publish versioned release and update rolling latest alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/ci/publish_versioned_releases.sh
