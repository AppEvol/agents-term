[package]
name = "agentsterm-daemon"
version = "0.3.0"
edition = "2021"
description = "Single-binary VM daemon and live app-debugging CLI for AgentsTerm"

[[bin]]
name = "agentsterm-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
libc = "0.2"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
